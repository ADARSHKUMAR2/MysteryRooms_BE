name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GCP_PROJECT_ID: mysteryai-507615
  GCP_REGION: asia-south1
  IMAGE_NAME: mysteryrooms-repo/backend

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        
    - name: Cache UV dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/uv
          backend/.venv
        key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-
          
    - name: Install dependencies
      working-directory: ./backend
      run: |
        uv sync
        
    - name: Run Ruff (Linter)
      working-directory: ./backend
      continue-on-error: true
      run: |
        uv pip install ruff
        uv run ruff check . || true
        
    - name: Run Black (Formatter Check)
      working-directory: ./backend
      continue-on-error: true
      run: |
        uv pip install black
        uv run black --check . || true
        
    - name: Run Bandit (Security)
      working-directory: ./backend
      continue-on-error: true
      run: |
        uv pip install bandit
        uv run bandit -r . -ll || true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        
    - name: Cache UV dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/uv
          backend/.venv
        key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-
          
    - name: Install dependencies
      working-directory: ./backend
      run: |
        uv sync
        
    - name: Run tests with coverage
      working-directory: ./backend
      continue-on-error: true
      env:
        MONGODB_URI: mongodb://localhost:27017/test_db
        MONGO_DB_NAME: test_db
        GATEWAY_PORT: 8000
        AUTH_SERVICE_PORT: 8001
        GAME_SERVICE_PORT: 8002
      run: |
        uv run pytest --cov=. --cov-report=xml --cov-report=html --cov-report=term -v || echo "No tests found yet"

  build-and-deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      
    - name: Configure Docker to use gcloud
      run: |
        gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev
        
    - name: Build Docker image
      working-directory: ./backend
      run: |
        docker build --platform linux/amd64 \
          -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest \
          .
        
    - name: Push to Artifact Registry
      run: |
        docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest

    - name: Deploy Gateway to Cloud Run
      run: |
        echo "Fetching service URLs..."
        AUTH_URL=$(gcloud run services describe mysteryrooms-auth --region ${{ env.GCP_REGION }} --format 'value(status.url)')
        GAME_URL=$(gcloud run services describe mysteryrooms-game --region ${{ env.GCP_REGION }} --format 'value(status.url)')
        
        echo "Detected AUTH_URL: $AUTH_URL"
        echo "Detected GAME_URL: $GAME_URL"
        
        if [ -z "$AUTH_URL" ]; then
          echo "❌ ERROR: AUTH_URL is empty! Auth service may not have deployed correctly."
          exit 1
        fi
        
        gcloud run deploy mysteryrooms-gateway \
          --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          --command uv \
          --args run,uvicorn,gateway.main:app,--host,0.0.0.0,--port,8000 \
          --port 8000 \
          --region ${{ env.GCP_REGION }} \
          --project ${{ env.GCP_PROJECT_ID }} \
          --allow-unauthenticated \
          --memory 1Gi \
          --cpu 1 \
          --timeout 300 \
          --max-instances 10 \
          --set-env-vars GATEWAY_PORT=8000,AUTH_SERVICE_URL=$AUTH_URL,GAME_SERVICE_URL=$GAME_URL \
          --quiet
          
    - name: Deploy Auth Service to Cloud Run
      run: |
        gcloud run deploy mysteryrooms-auth \
          --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          --command uv \
          --args run,uvicorn,services.auth.main:app,--host,0.0.0.0,--port,8001 \
          --port 8001 \
          --region ${{ env.GCP_REGION }} \
          --project ${{ env.GCP_PROJECT_ID }} \
          --allow-unauthenticated \
          --memory 1Gi \
          --cpu 1 \
          --timeout 300 \
          --max-instances 10 \
          --set-env-vars AUTH_SERVICE_PORT=8001,DOTENV_PATH=/secrets/py_env_file,FIREBASE_CREDENTIALS_PATH=/secrets/firebase/service-account.json \
          --set-secrets /secrets/py_env_file=py_env_file:latest,/secrets/firebase/service-account.json=firebase-service-account:latest \
          --quiet
          
    - name: Deploy Game Service to Cloud Run
      run: |
        gcloud run deploy mysteryrooms-game \
          --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          --command uv \
          --args run,uvicorn,services.game.main:app,--host,0.0.0.0,--port,8002 \
          --port 8002 \
          --region ${{ env.GCP_REGION }} \
          --project ${{ env.GCP_PROJECT_ID }} \
          --allow-unauthenticated \
          --memory 1Gi \
          --cpu 1 \
          --timeout 300 \
          --max-instances 10 \
          --set-env-vars GAME_SERVICE_PORT=8002,DOTENV_PATH=/secrets/py_env_file,LANGCHAIN_TRACING_V2=true,LANGCHAIN_ENDPOINT=https://api.smith.langchain.com,LANGCHAIN_PROJECT=AI_MysteryRooms \
          --set-secrets /secrets/py_env_file=py_env_file:latest \
          --quiet
          
    - name: Get Service URLs
      run: |
        echo "🚀 Deployment Complete!"
        echo "Gateway URL: $(gcloud run services describe mysteryrooms-gateway --region ${{ env.GCP_REGION }} --format 'value(status.url)')"
        echo "Auth URL: $(gcloud run services describe mysteryrooms-auth --region ${{ env.GCP_REGION }} --format 'value(status.url)')"
        echo "Game URL: $(gcloud run services describe mysteryrooms-game --region ${{ env.GCP_REGION }} --format 'value(status.url)')"

    - name: Clean up old Docker images and Cloud Run revisions
      run: |
        echo "🧹 Starting cleanup of old data..."
        
        # 1. Clean up old Docker Images in Artifact Registry (Keep last 5)
        echo "Cleaning up old images in Artifact Registry..."
        IMAGE_PATH="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}"
        
        # Get all image digests sorted by date (oldest last) and keep the top 5
        gcloud artifacts docker images list $IMAGE_PATH \
          --sort-by="~UPDATE_TIME" \
          --format="value(version)" | tail -n +3 | while read DIGEST; do
            echo "Deleting image digest: $DIGEST"
            gcloud artifacts docker images delete "$IMAGE_PATH@$DIGEST" --delete-tags --quiet || true
        done

        # 2. Clean up old Cloud Run Revisions (Keep last 5)
        echo "Cleaning up old Cloud Run revisions..."
        SERVICES=("mysteryrooms-gateway" "mysteryrooms-auth" "mysteryrooms-game")
        
        for SERVICE in "${SERVICES[@]}"; do
          echo "Checking revisions for $SERVICE..."
          gcloud run revisions list --service $SERVICE --region ${{ env.GCP_REGION }} \
            --format="value(name)" \
            --sort-by="~metadata.creationTimestamp" | tail -n +3 | while read REVISION; do
              echo "Deleting revision: $REVISION"
              gcloud run revisions delete $REVISION --region ${{ env.GCP_REGION }} --quiet || true
          done
        done
        
        echo "✅ Cleanup complete!"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        scan-type: 'fs'
        scan-ref: './backend'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'
