name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Setup Firebase credentials
      run: |
        if [ -n "${FIREBASE_KEY}" ]; then
          echo "${FIREBASE_KEY}" | base64 -d > ${{ github.workspace }}/backend/serviceAccountKey.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ github.workspace }}/backend/serviceAccountKey.json" >> $GITHUB_ENV
        else
          echo "⚠️ FIREBASE_SERVICE_ACCOUNT not set - skipping Firebase setup"
        fi
      env:
        FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        
    - name: Cache UV dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/uv
          backend/.venv
        key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-
          
    - name: Install dependencies
      working-directory: ./backend
      run: |
        uv sync
        
    - name: Run Ruff (Linter)
      working-directory: ./backend
      continue-on-error: true
      run: |
        uv pip install ruff
        uv run ruff check . || true
        
    - name: Run Black (Formatter Check)
      working-directory: ./backend
      continue-on-error: true
      run: |
        uv pip install black
        uv run black --check . || true
        
    - name: Run Bandit (Security)
      working-directory: ./backend
      continue-on-error: true
      run: |
        uv pip install bandit
        uv run bandit -r . -ll || true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Setup Firebase credentials
      run: |
        if [ -n "${FIREBASE_KEY}" ]; then
          echo "${FIREBASE_KEY}" | base64 -d > ${{ github.workspace }}/backend/serviceAccountKey.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ github.workspace }}/backend/serviceAccountKey.json" >> $GITHUB_ENV
        else
          echo "⚠️ FIREBASE_SERVICE_ACCOUNT not set - skipping Firebase setup"
        fi
      env:
        FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        
    - name: Cache UV dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/uv
          backend/.venv
        key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-
          
    - name: Install dependencies
      working-directory: ./backend
      run: |
        uv sync
        
    - name: Run tests with coverage
      working-directory: ./backend
      continue-on-error: true
      env:
        MONGODB_URI: mongodb://localhost:27017/test_db
        MONGO_DB_NAME: test_db
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
        LANGCHAIN_TRACING_V2: false
        GATEWAY_PORT: 8000
        AUTH_SERVICE_PORT: 8001
        GAME_SERVICE_PORT: 8002
      run: |
        uv run pytest --cov=. --cov-report=xml --cov-report=html --cov-report=term -v || echo "No tests found yet"
        
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: always()
      continue-on-error: true
      with:
        files: ./backend/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-
          
    - name: Build Docker image
      working-directory: ./backend
      run: |
        docker build -t mysteryrooms-backend:${{ github.sha }} .
        
    - name: Test Docker image
      run: |
        docker run --rm mysteryrooms-backend:${{ github.sha }} python --version
        
    - name: Log in to Docker Hub
      if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Push to Docker Hub
      if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
      run: |
        docker tag mysteryrooms-backend:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/mysteryrooms-backend:latest
        docker tag mysteryrooms-backend:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/mysteryrooms-backend:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/mysteryrooms-backend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/mysteryrooms-backend:${{ github.sha }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        scan-type: 'fs'
        scan-ref: './backend'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'
