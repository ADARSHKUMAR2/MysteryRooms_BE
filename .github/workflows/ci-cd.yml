name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  IMAGE_NAME: mysteryrooms-backend

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        
    - name: Cache UV dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/uv
          backend/.venv
        key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-
          
    - name: Install dependencies
      working-directory: ./backend
      run: |
        uv sync
        
    - name: Run Ruff (Linter)
      working-directory: ./backend
      continue-on-error: true
      run: |
        uv pip install ruff
        uv run ruff check . || true
        
    - name: Run Black (Formatter Check)
      working-directory: ./backend
      continue-on-error: true
      run: |
        uv pip install black
        uv run black --check . || true
        
    - name: Run Bandit (Security)
      working-directory: ./backend
      continue-on-error: true
      run: |
        uv pip install bandit
        uv run bandit -r . -ll || true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        
    - name: Cache UV dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/uv
          backend/.venv
        key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-
          
    - name: Install dependencies
      working-directory: ./backend
      run: |
        uv sync
        
    - name: Run tests with coverage
      working-directory: ./backend
      continue-on-error: true
      env:
        MONGODB_URI: mongodb://localhost:27017/test_db
        MONGO_DB_NAME: test_db
        GATEWAY_PORT: 8000
        AUTH_SERVICE_PORT: 8001
        GAME_SERVICE_PORT: 8002
      run: |
        uv run pytest --cov=. --cov-report=xml --cov-report=html --cov-report=term -v || echo "No tests found yet"

  build-and-deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      
    - name: Configure Docker to use gcloud
      run: |
        gcloud auth configure-docker
        
    - name: Build Docker image
      working-directory: ./backend
      run: |
        docker build -t gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
        docker build -t gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest .
        
    - name: Push to GCR
      run: |
        docker push gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        docker push gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest
        
    - name: Deploy Gateway to Cloud Run
      run: |
        gcloud run deploy mysteryrooms-gateway \
          --image gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --allow-unauthenticated \
          --port 8000 \
          --set-env-vars "GATEWAY_PORT=8000,AUTH_SERVICE_PORT=8001,GAME_SERVICE_PORT=8002" \
          --set-secrets "MONGODB_URI=MONGODB_URI:latest,GROQ_API_KEY=GROQ_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,LANGCHAIN_API_KEY=LANGCHAIN_API_KEY:latest,FIREBASE_SERVICE_ACCOUNT=FIREBASE_SERVICE_ACCOUNT:latest" \
          --memory 1Gi \
          --cpu 1 \
          --timeout 300 \
          --max-instances 10 \
          --quiet
          
    - name: Deploy Auth Service to Cloud Run
      run: |
        gcloud run deploy mysteryrooms-auth \
          --image gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --no-allow-unauthenticated \
          --port 8001 \
          --set-env-vars "AUTH_SERVICE_PORT=8001" \
          --set-secrets "MONGODB_URI=MONGODB_URI:latest,FIREBASE_SERVICE_ACCOUNT=FIREBASE_SERVICE_ACCOUNT:latest" \
          --memory 1Gi \
          --cpu 1 \
          --timeout 300 \
          --max-instances 10 \
          --quiet
          
    - name: Deploy Game Service to Cloud Run
      run: |
        gcloud run deploy mysteryrooms-game \
          --image gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --no-allow-unauthenticated \
          --port 8002 \
          --set-env-vars "GAME_SERVICE_PORT=8002" \
          --set-secrets "MONGODB_URI=MONGODB_URI:latest,GROQ_API_KEY=GROQ_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,LANGCHAIN_API_KEY=LANGCHAIN_API_KEY:latest" \
          --memory 2Gi \
          --cpu 2 \
          --timeout 300 \
          --max-instances 10 \
          --quiet
          
    - name: Get Service URLs
      run: |
        echo "🚀 Deployment Complete!"
        echo "Gateway URL: $(gcloud run services describe mysteryrooms-gateway --region ${{ env.GCP_REGION }} --format 'value(status.url)')"
        echo "Auth URL: $(gcloud run services describe mysteryrooms-auth --region ${{ env.GCP_REGION }} --format 'value(status.url)')"
        echo "Game URL: $(gcloud run services describe mysteryrooms-game --region ${{ env.GCP_REGION }} --format 'value(status.url)')"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        scan-type: 'fs'
        scan-ref: './backend'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'
