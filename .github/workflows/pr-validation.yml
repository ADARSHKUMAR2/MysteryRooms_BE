name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-pr:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Validate PR title
      uses: amannn/action-semantic-pull-request@v5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        types: |
          feat
          fix
          docs
          style
          refactor
          perf
          test
          chore
          
    - name: Check PR size
      run: |
        changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | wc -l)
        if [ $changed_files -gt 50 ]; then
          echo "⚠️ Warning: This PR modifies $changed_files files. Consider splitting into smaller PRs."
        fi
        
    - name: Validate branch name
      run: |
        branch_name="${{ github.head_ref }}"
        if [[ ! $branch_name =~ ^(feature|bugfix|hotfix|release)/.+ ]]; then
          echo "⚠️ Branch name should follow pattern: feature/*, bugfix/*, hotfix/*, or release/*"
        fi
